<!--
  Modèle Supabase « Confirm signup » (Authentication > Emails > Templates).
  À coller tel quel dans le corps du modèle. Objet conseillé :
  « Confirme ton adresse — TwinPost ».
  Au style du site : fond noir, le nom en capitales larges, un titre en deux
  temps, un bouton blanc. Rien que du HTML en ligne, lu par tous les clients.
-->
<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#08080b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#08080b;">
      <tr>
        <td align="center" style="padding:48px 20px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;font-family:'Helvetica Neue',Arial,sans-serif;color:#f7f7fa;">
            <tr>
              <td style="font-size:16px;font-weight:900;letter-spacing:2px;color:#ffffff;">TWINPOST</td>
            </tr>
            <tr>
              <td style="padding-top:56px;font-size:40px;line-height:1;font-weight:800;letter-spacing:-1px;color:#ffffff;">
                Bienvenue.
              </td>
            </tr>
            <tr>
              <td style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:40px;line-height:1.1;color:#ffffff;">
                Ton personnage t'attend.
              </td>
            </tr>
            <tr>
              <td style="padding-top:20px;font-size:15px;line-height:1.55;color:rgba(255,255,255,0.74);">
                Confirme ton adresse pour ouvrir le studio et recevoir tes crédits offerts.
              </td>
            </tr>
            <tr>
              <td style="padding-top:32px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 28px;border-radius:999px;background:#ffffff;color:#0c0c10;font-size:15px;font-weight:700;text-decoration:none;">
                  Confirmer mon adresse
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:48px;border-bottom:1px solid rgba(255,255,255,0.14);"></td>
            </tr>
            <tr>
              <td style="padding-top:20px;font-size:12px;line-height:1.5;color:rgba(255,255,255,0.5);">
                Tu n'as pas créé de compte sur TwinPost ? Ignore ce message.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
